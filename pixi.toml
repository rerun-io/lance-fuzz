[workspace]
name = "lance-fuzz"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
version = "0.0.0"

[dependencies]
gitpython = ">=3.1.40"
mypy = "1.14.1.*"
ruff = "0.11.6.*"

# Needs `lld` on PATH (e.g. `apt install lld`); see hack/cc-lld.
[target.linux-aarch64.activation.env]
CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER = "$PIXI_PROJECT_ROOT/hack/cc-lld"

[tasks.py-fmt]
cmd = "ruff check --fix --config pyproject.toml . && ruff format --config pyproject.toml ."

[tasks.py-fmt-check]
cmd = "ruff check --config pyproject.toml . && ruff format --check --config pyproject.toml"

[tasks.py-lint]
cmd = "mypy --install-types --non-interactive --no-warn-unused-ignore"

[tasks.fuzz-build]
description = "Build the fuzz target"
cmd = "cargo +nightly fuzz build --fuzz-dir . dataset_ops"

[tasks.fuzz-coverage]
description = "Build with coverage, replay the corpus, then print a per-crate report"
cmd = "uv run hack/coverage-report.py {{ target }} --collect --min-dark {{ min_dark }}"
args = [
  { arg = "target", default = "dataset_ops" },
  { arg = "min_dark", default = "400" },
]

[tasks.fuzz-coverage-report]
description = "Re-render the coverage report from the last collected profdata (no replay)"
cmd = "uv run hack/coverage-report.py {{ target }} --min-dark {{ min_dark }}"
args = [
  { arg = "target", default = "dataset_ops" },
  { arg = "min_dark", default = "400" },
]

[tasks.crash-check]
description = "Replay the tracked crash inputs and report fixes, regressions and changed behaviour"
cmd = "uv run hack/crash-check.py {{ target }} --retries {{ retries }}"
args = [
  { arg = "target", default = "dataset_ops" },
  { arg = "retries", default = "1" },
]

[tasks.crash-import]
description = "Add artifacts from artifacts/<target>* into the tracked crash suite"
cmd = "uv run hack/crash-check.py {{ target }} --import --per-class {{ per_class }}"
args = [
  { arg = "target", default = "dataset_ops" },
  { arg = "per_class", default = "3" },
]

[tasks.fuzz]
description = "Run dataset_ops with one independent worker per CPU core, sharing the corpus"
# Workers replace -fork: in fork mode the parent merges every job's results on one core, which
# starves the other cores on slow dataset_ops sessions. A crash ends only that worker's job and a
# new one takes its place (-jobs is effectively unlimited), so `secs` bounds the whole run instead
# of -max_total_time, which libFuzzer applies per job.
cmd = """
bash -c '
  set -m
  cores=$(getconf _NPROCESSORS_ONLN 2>/dev/null || sysctl -n hw.ncpu)
  dir=logs/dataset_ops-$(date +%s)
  mkdir -p "$dir"
  echo "logging to $dir"
  cd "$dir"

  cargo +nightly fuzz run --fuzz-dir ../.. dataset_ops -- \
    -len_control=0 \
    -max_len=4096 \
    -workers="$cores" \
    -jobs=1000000 \
    > run.log 2>&1 &
  pid=$!
  trap "kill -INT -- -$pid" INT TERM
  if [ {{ secs }} -gt 0 ]; then
    sleep {{ secs }}
    kill -INT -- -$pid
  fi
  wait $pid
'
"""
args = [{ arg = "secs", default = "0" }]
