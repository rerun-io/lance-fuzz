# Adapted from https://github.com/rerun-io/rerun_template
name: Python

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  python-check:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.72.1

      - run: pixi run py-fmt-check
      - run: pixi run py-lint
